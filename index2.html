<html lang="en">
<meta charset="UTF-8">
<title>ibarkback.org</title>

<style>
body {
  margin: 20px ;
   background-image: url("/img/background.png");
    background-size: cover;
    background-position: center;
    background-repeat: repeat;
}

html {
  scroll-behavior: smooth;
}

/* classes */
.box { 
  background-color: rgb(170, 201, 126);
  width: 50%;
  margin: 0 auto;
}

.text { 
  margin: 20px;
}

.logo-oval {
  position: relative;
  width: 180px;
  height: 110px;

  /* Oval shape */
  border-radius: 50%;
  overflow: hidden;

  /* Silver metallic frame */
  border: 2px solid #888;
  background: linear-gradient(
    to bottom,
    #ffffff 0%,
    #d9d9d9 25%,
    #a6a6a6 50%,
    #eeeeee 75%,
    #999999 100%
  );

  /* Raised 3D effect */
  box-shadow:
    0 3px 6px rgba(0, 0, 0, 0.35),
    inset 0 2px 3px rgba(255, 255, 255, 0.95),
    inset 0 -3px 5px rgba(0, 0, 0, 0.3);
}

/* Your rectangular image */
.logo-oval img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

/* Glossy glass highlight */
.logo-oval::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;

  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.75) 0%,
    rgba(255, 255, 255, 0.25) 25%,
    transparent 52%,
    rgba(0, 0, 0, 0.08) 100%
  );

  box-shadow:
    inset 0 2px 2px rgba(255, 255, 255, 0.9),
    inset 0 -2px 3px rgba(0, 0, 0, 0.25);
}

.header {
	height: 17px;
  background-color: #0a0a0a;
  display: flex;
  justify-content: space-between;
  padding: 5px;
  margin-bottom: 20px; 
  margin-top: 100px;
  margin-left: 50px;
}

.header a {
  text-decoration: none;
  color: #f6ce14;
}

</style>
<head>
<div class="logo-oval">
  <a href="index.html"><img src="/img/sitelogo.png" alt="logo"></a>
</div>
<div class="header">

    <span><a href="/readinglist/index.html">reading list</a></span>
    <span><a href="/calvinvill/index.html">calvinvill wiki</a></span>

</div>
</head>
