<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>[page title]</title>

<style>
    html {
      scroll-behavior: smooth;
    }

    body {
      background-image: url("/img/background.png");
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      font-family: Arial, Helvetica, sans-serif;
    }

    hr {
    border-color: darkgray;  
    }

    .header { 
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        background-color: white;
        height: 15%;
    }

    .headertxt { 
        text-align: left;
        margin: 10px;
    }

    .bar { 
        background-color: #D1C4E9;
        text-align: left;
        margin-left: 10px;
        padding-bottom: 0;
        padding-top: 0;
        font-family: Georgia, 'Times New Roman', Times, serif;
        height: 20px;
    }
</style>

<script>
    /* date */
    const dateEl = document.getElementById('date');
    const now = new Date();
    dateEl.textContent = now.toLocaleDateString('en-US', {
      weekday: 'long',
      year: 'numeric',
      month: 'long',
      day: 'numeric'
    });

</script>


<body>
<div class="header">
    <div><a href="index.html"><img src="images/emblem2.png" height="125"></a></div>
    <div class="headertxt">
        <span id="date"></span>
    </div>
</div>

<div class="bar"></div>
    
</body>
