    body {
        margin: 0px;

    /* containers */
    .header {

    .datetxt {

    h2 {

        padding-top: 0;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-weight: bold;
        column-span: all;
        display: block;
        margin: 0;
        text-indent: 15%;
    }

    .main { 
        display: inline-block;
        width: 100%;
        position: absolute;
    }

    .Lbox { 
        width: 15%;
        position: absolute;
        margin-left: 5%;
        margin-top: 0;
        margin-right: 0;
        margin-bottom: 5%;
        padding: 5%;
        text-align: left;
        font-size: 10;
    }

    .contents {
        width: 85%;
        position: absolute;
        margin-right: 5%;
        margin-bottom: 5%;
        margin-left: 0;
        margin-top: 0;
        padding: 5%;
        background-color: white;
        border-left: 1px;
        border-left-style: solid;
        border-left-color: #ccc;
    }

    /* style classes (unrelated to containers) */
    .khouzan-month { 
        font-family: 'calvinese';

    }

</style>

        <div id="customDate"></div>
        <div id="customDateScript"></div>
        <div id="gregorianDate"></div>
    </div>

<h2>[article title]</h2>

<div class="main">
    <div class="Lbox">

    </div>
    
    <div class="contents">

    </div>

</div>




<script>
        /* khouzan date */
          const MONTH_NAMES = [
    'siahpiare',
    'ahpiar',
    'eliou',
    'tsipeti',
    "di'si"
  ];
  const DAYS_PER_MONTH = 73;
  const DAYS_PER_YEAR  = 365;   // 5 × 73
  const YEAR_OFFSET    = 4334;

  const EPOCH_GREGORIAN = Date.UTC(2000, 0, 1);
  const MS_PER_DAY = 86400000;

  function toCustomCalendar(date) {
    // Days elapsed since Jan 1, 2000 — used only for month/day-of-year
    const daysSinceAnchor = Math.floor(
      (Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - EPOCH_GREGORIAN)
      / MS_PER_DAY
    );

    // Day within the current 365-day cycle, 0-based
    const dayOfYear = ((daysSinceAnchor % DAYS_PER_YEAR) + DAYS_PER_YEAR) % DAYS_PER_YEAR;

    const monthIdx = Math.floor(dayOfYear / DAYS_PER_MONTH);
    const day      = (dayOfYear % DAYS_PER_MONTH) + 1;

    return {
      year:      date.getFullYear() + YEAR_OFFSET,
      day:       day,
      monthName: MONTH_NAMES[monthIdx]
    };
  }

  function formatCustom(c) {
    return `${c.day} ${c.monthName} ${c.year}`;
  }

  function formatGregorian(d) {
    return d.toLocaleDateString('en-US', {
      weekday: 'long',
      year:    'numeric',
      month:   'long',
      day:     'numeric'
    });
  }

  const now = new Date();
  document.getElementById('gregorianDate').textContent = formatGregorian(now);
  document.getElementById('customDate').textContent    = formatCustom(toCustomCalendar(now));

  // Styled month line: same date, month uppercased, in custom font
const c = toCustomCalendar(now);
document.getElementById('customDateScript').innerHTML =
  `${c.day} <span class="khouzan-month">${c.monthName.toUpperCase()}</span> ${c.year}`;


</script>
</body>
