<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>[page title]</title>

<style>
    html {
      scroll-behavior: smooth;
    }

    body {
        margin: 0px;
      background-image: url("/img/background.png");
      background-size: cover;
      background-position: center;
      background-repeat: repeat;
      font-family: Arial, Helvetica, sans-serif;
    }

    hr {
    border-color: black;  
    width: 50%;
    border-style: ridge;
    }

    .header { 
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        background-color: white;
        height: 15%;
        margin: 0px;
    }

    .datetxt { 
        position: absolute;
        right: 0;
        top: 10%;
        text-align: right;
        font-size: 10px;
        font-family: Georgia, 'Times New Roman', Times, serif;
    }

    h2 { 
        background-color: #D1C4E9;
        text-align: left;
        padding-bottom: 0;
        padding-top: 0;
        font-family: Georgia, 'Times New Roman', Times, serif;
        font-weight: bold;
        column-span: all;
        display: block;
        margin: 0;
        text-indent: 20px;
    }

</style>
</head>

<body>
<div class="header">
    <div><a href="index.html"><img src="images/emblem2.png" height="125"></a></div>
    <div class="datetxt">
        <div><span id="date"></span></div>
    </div>
</div>

<h2>[article title]</h2>


<script>
        /* date */
        const dateEl = document.getElementById('date');
        const now = new Date();
        dateEl.textContent = now.toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
        });

        /* khouzan date */
        

</script>
</body>
